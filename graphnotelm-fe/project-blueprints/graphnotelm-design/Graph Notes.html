<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Graph Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

  <!-- React + Babel for the Tweaks panel only -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    /* ── Tokens ─────────────────────────────────────────────────────────── */
    :root {
      /* warm neutral dark palette (default) */
      --bg:        oklch(0.18 0.005 60);
      --bg-2:      oklch(0.21 0.006 60);
      --bg-3:      oklch(0.24 0.006 60);
      --hover:     oklch(0.27 0.008 60);
      --border:    oklch(0.30 0.008 60);
      --border-strong: oklch(0.38 0.010 60);
      --text:      oklch(0.92 0.008 75);
      --text-2:    oklch(0.70 0.010 70);
      --text-3:    oklch(0.50 0.010 65);
      --accent:    oklch(0.78 0.14 70);    /* amber */
      --accent-2:  oklch(0.78 0.14 70 / 0.12);
      --green:     oklch(0.78 0.13 145);
      --blue:      oklch(0.78 0.11 240);
      --red:       oklch(0.72 0.16 25);

      --radius: 4px;
      --radius-lg: 6px;
      --font-ui: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --font-body: 'Inter', system-ui, sans-serif;

      --sidebar-w: 260px;
      --chat-w: 360px;
      --header-h: 44px;

      --t-fast: 120ms cubic-bezier(.4,0,.2,1);
      --t-med:  220ms cubic-bezier(.4,0,.2,1);
      --t-slow: 380ms cubic-bezier(.4,0,.2,1);
    }
    html[data-theme="light"] {
      --bg:        oklch(0.985 0.004 75);
      --bg-2:      oklch(0.965 0.005 75);
      --bg-3:      oklch(0.945 0.006 75);
      --hover:     oklch(0.92 0.008 75);
      --border:    oklch(0.89 0.008 75);
      --border-strong: oklch(0.80 0.010 75);
      --text:      oklch(0.22 0.008 70);
      --text-2:    oklch(0.45 0.010 70);
      --text-3:    oklch(0.62 0.010 70);
      --accent:    oklch(0.55 0.16 55);
      --accent-2:  oklch(0.55 0.16 55 / 0.12);
      --green:     oklch(0.55 0.14 145);
      --blue:      oklch(0.55 0.13 240);
      --red:       oklch(0.55 0.18 25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }
    body {
      font-family: var(--font-ui);
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background var(--t-med), color var(--t-med);
    }

    /* subtle dotted bg in dark mode for spatial feel */
    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image: radial-gradient(var(--border) 0.5px, transparent 0.5px);
      background-size: 22px 22px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    html[data-theme="light"] body::before { opacity: 0.5; }

    button, input, textarea, select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }
    button { cursor: pointer; background: none; border: none; }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      height: var(--header-h);
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 14px;
      gap: 14px;
      position: relative; z-index: 5;
    }
    .brand {
      display: flex; align-items: center; gap: 8px;
      font-weight: 600; font-size: 12px;
      letter-spacing: 0.02em;
    }
    .brand-mark {
      width: 14px; height: 14px;
      position: relative;
    }
    .brand-mark svg { width: 100%; height: 100%; display: block; }
    .brand-mark .dot { fill: var(--accent); }
    .brand-mark .ln { stroke: var(--text-2); stroke-width: 1; }

    .breadcrumb {
      display: flex; align-items: center; gap: 6px;
      color: var(--text-3); font-size: 11px;
      flex: 1; min-width: 0; overflow: hidden;
    }
    .breadcrumb .crumb {
      cursor: pointer;
      padding: 2px 6px;
      border-radius: var(--radius);
      transition: background var(--t-fast), color var(--t-fast);
      white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; max-width: 220px;
    }
    .breadcrumb .crumb:hover { background: var(--hover); color: var(--text); }
    .breadcrumb .crumb.current { color: var(--text); cursor: default; }
    .breadcrumb .crumb.current:hover { background: transparent; }
    .breadcrumb .sep { color: var(--text-3); opacity: 0.5; user-select: none; }

    .nav-btns {
      display: flex; align-items: center; gap: 2px;
    }
    .nav-btn {
      width: 24px; height: 24px;
      display: grid; place-items: center;
      border-radius: var(--radius);
      color: var(--text-2);
      transition: background var(--t-fast), color var(--t-fast), opacity var(--t-fast);
    }
    .nav-btn:hover:not(:disabled) { background: var(--hover); color: var(--text); }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }
    .nav-btn svg { width: 14px; height: 14px; }

    .header-right {
      display: flex; align-items: center; gap: 6px;
    }

    .save-status {
      display: flex; align-items: center; gap: 6px;
      font-size: 10.5px; color: var(--text-3);
      letter-spacing: 0.04em; text-transform: uppercase;
      padding: 0 8px;
      transition: color var(--t-med);
    }
    .save-status .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-3);
      transition: background var(--t-med), box-shadow var(--t-med);
    }
    .save-status.saving .dot { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
    .save-status.saved .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .icon-btn {
      width: 28px; height: 28px;
      display: grid; place-items: center;
      border-radius: var(--radius);
      color: var(--text-2);
      transition: background var(--t-fast), color var(--t-fast);
    }
    .icon-btn:hover { background: var(--hover); color: var(--text); }
    .icon-btn svg { width: 15px; height: 15px; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px;
      font-size: 11.5px;
      border-radius: var(--radius);
      color: var(--text);
      background: var(--bg-3);
      border: 1px solid var(--border);
      transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast);
    }
    .btn:hover { background: var(--hover); border-color: var(--border-strong); }
    .btn:active { transform: translateY(1px); }
    .btn.primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 600;
    }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn svg { width: 12px; height: 12px; }

    /* ── Chat panel ─────────────────────────────────────────────────────── */
    .chat-panel {
      position: fixed; top: var(--header-h); right: 0; bottom: 0;
      width: var(--chat-w); max-width: 92vw;
      background: var(--bg-2);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform var(--t-med);
      z-index: 40;
      box-shadow: -16px 0 40px -20px rgba(0,0,0,0.5);
    }
    .chat-panel.open { transform: translateX(0); }
    .chat-head {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .chat-head .title {
      font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em;
      display: flex; align-items: center; gap: 8px;
    }
    .chat-head .title svg { width: 13px; height: 13px; color: var(--accent); }
    .chat-head .ctx {
      font-size: 10px; color: var(--text-3); letter-spacing: 0.04em;
      flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chat-head .ctx b { color: var(--accent); font-weight: 500; font-family: var(--font-ui); }
    .chat-head .icon-btn { width: 24px; height: 24px; }
    .chat-head .icon-btn svg { width: 13px; height: 13px; }
    .chat-body {
      flex: 1; overflow-y: auto;
      padding: 16px 14px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .chat-body::-webkit-scrollbar { width: 6px; }
    .chat-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .chat-msg { display: flex; gap: 8px; align-items: flex-start; animation: chatIn 220ms ease both; }
    @keyframes chatIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .chat-avatar {
      width: 22px; height: 22px; border-radius: 5px;
      background: var(--bg-3); border: 1px solid var(--border);
      display: grid; place-items: center; flex-shrink: 0;
      font-size: 10px; font-weight: 600; color: var(--text-2);
      font-family: var(--font-ui);
    }
    .chat-msg.ai .chat-avatar { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .chat-bubble {
      padding: 8px 11px; border-radius: 8px;
      font-size: 12.5px; line-height: 1.55;
      font-family: var(--font-body); color: var(--text);
      max-width: 100%; word-wrap: break-word; white-space: pre-wrap;
    }
    .chat-msg.user .chat-bubble { background: var(--bg-3); border: 1px solid var(--border); }
    .chat-msg.ai .chat-bubble { background: var(--accent-2); border: 1px solid color-mix(in oklch, var(--accent) 30%, transparent); }
    .chat-ref {
      display: inline-flex; align-items: center; gap: 3px;
      font-family: var(--font-ui);
      padding: 1px 6px; border-radius: 8px;
      background: var(--bg); border: 1px solid var(--border);
      color: var(--accent); font-size: 10.5px;
      cursor: pointer; text-decoration: none; margin: 0 1px;
    }
    .chat-ref::before { content: "#"; opacity: 0.6; }
    .chat-ref:hover { background: var(--accent-2); }
    .chat-typing { display: inline-flex; align-items: center; gap: 3px; }
    .chat-typing span {
      width: 5px; height: 5px; border-radius: 50%;
      background: currentColor; opacity: 0.5;
      animation: typingDot 1.1s ease infinite;
    }
    .chat-typing span:nth-child(2) { animation-delay: 0.15s; }
    .chat-typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typingDot { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-3px); opacity: 1; } }
    .chat-suggestions { display: flex; flex-direction: column; gap: 6px; padding: 0 4px; }
    .chat-suggestions .label {
      font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-3); margin-bottom: 4px;
    }
    .chat-sug {
      text-align: left;
      padding: 8px 10px; font-size: 11.5px;
      font-family: var(--font-body); color: var(--text-2);
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
      cursor: pointer; line-height: 1.45;
    }
    .chat-sug:hover { background: var(--bg-3); color: var(--text); border-color: var(--border-strong); }
    .chat-sug::before { content: "→ "; color: var(--accent); }
    .chat-input-wrap { flex-shrink: 0; padding: 10px 12px 12px; border-top: 1px solid var(--border); }
    .chat-input-row {
      display: flex; align-items: flex-end; gap: 6px;
      padding: 8px 8px 8px 12px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      transition: border-color var(--t-fast);
    }
    .chat-input-row:focus-within { border-color: var(--accent); }
    .chat-input-row textarea {
      flex: 1; background: transparent; border: none;
      color: var(--text); font-family: var(--font-body);
      font-size: 13px; line-height: 1.5;
      resize: none; outline: none;
      min-height: 20px; max-height: 120px; padding: 2px 0;
    }
    .chat-input-row textarea::placeholder { color: var(--text-3); }
    .chat-send {
      width: 26px; height: 26px;
      display: grid; place-items: center;
      border-radius: 4px;
      background: var(--accent); color: var(--bg);
      flex-shrink: 0;
    }
    .chat-send:hover { filter: brightness(1.08); }
    .chat-send:disabled { opacity: 0.4; cursor: not-allowed; }
    .chat-send svg { width: 12px; height: 12px; }
    .chat-foot {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 6px; font-size: 9.5px;
      color: var(--text-3); letter-spacing: 0.06em;
    }
    .chat-foot kbd {
      font-family: var(--font-ui); font-size: 9px;
      padding: 1px 4px; border-radius: 3px;
      background: var(--bg); border: 1px solid var(--border);
    }
    @media (min-width: 1100px) {
      body.chat-open .layout { padding-right: var(--chat-w); transition: padding var(--t-med); }
    }
    .icon-btn.chat-toggle.active { background: var(--accent-2); color: var(--accent); }

    /* ── Layout ─────────────────────────────────────────────────────────── */
    .layout {
      display: flex;
      height: calc(100vh - var(--header-h));
      position: relative;
      z-index: 1;
    }

    /* ── Sidebar ───────────────────────────────────────────────────────── */
    aside {
      width: var(--sidebar-w);
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-section {
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
    }
    .sidebar-section.tight { padding: 8px 12px; }
    .label {
      font-size: 9.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-3);
      font-weight: 500;
    }
    .sidebar-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .count-pill {
      font-size: 10px;
      color: var(--text-3);
      padding: 1px 6px;
      border-radius: 10px;
      background: var(--bg-3);
      border: 1px solid var(--border);
    }

    .search-wrap {
      position: relative;
    }
    .search-wrap svg {
      position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
      width: 12px; height: 12px; color: var(--text-3);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 10px 6px 26px;
      font-size: 12px;
      color: var(--text);
      transition: border-color var(--t-fast), background var(--t-fast);
    }
    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--bg);
    }
    .search-input::placeholder { color: var(--text-3); }

    .tag-bar {
      display: flex; flex-wrap: wrap; gap: 4px;
    }
    .tag-bar:empty { display: none; }

    .tag-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 7px;
      font-size: 10.5px;
      border-radius: 10px;
      border: 1px solid;
      cursor: pointer;
      transition: opacity var(--t-fast), transform var(--t-fast);
      letter-spacing: 0.01em;
      user-select: none;
    }
    .tag-pill:hover { opacity: 0.78; }
    .tag-pill.muted { opacity: 0.55; }
    .tag-pill.active {
      box-shadow: inset 0 0 0 1px currentColor;
    }
    .tag-pill .x {
      opacity: 0.55; font-size: 12px; line-height: 1;
      cursor: pointer;
    }
    .tag-pill .x:hover { opacity: 1; }
    .tag-pill.all {
      background: var(--bg-3);
      border-color: var(--border);
      color: var(--text-2);
    }
    .tag-pill.all.active { color: var(--text); }

    .note-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 6px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .note-list::-webkit-scrollbar { width: 8px; }
    .note-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .note-list::-webkit-scrollbar-track { background: transparent; }

    .note-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 12px;
      color: var(--text-2);
      transition: background var(--t-fast), color var(--t-fast);
      position: relative;
    }
    .note-item:hover { background: var(--hover); color: var(--text); }
    .note-item.active {
      background: var(--bg-3);
      color: var(--text);
    }
    .note-item.active::before {
      content: "";
      position: absolute; left: 0; top: 6px; bottom: 6px;
      width: 2px; background: var(--accent);
      border-radius: 1px;
    }
    .note-dot {
      width: 6px; height: 6px; border-radius: 50%;
      flex-shrink: 0;
      background: var(--border-strong);
    }
    .note-name {
      flex: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .note-meta {
      font-size: 9.5px;
      color: var(--text-3);
      flex-shrink: 0;
    }

    .empty-list {
      padding: 24px 12px;
      text-align: center;
      color: var(--text-3);
      font-size: 11px;
      line-height: 1.6;
    }

    /* ── Editor ────────────────────────────────────────────────────────── */
    main {
      flex: 1;
      overflow-y: auto;
      position: relative;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    main::-webkit-scrollbar { width: 10px; }
    main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

    .empty-state {
      height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      color: var(--text-3);
      text-align: center;
    }
    .empty-state .glyph {
      width: 48px; height: 48px;
      opacity: 0.4;
    }
    .empty-state h2 {
      font-size: 14px; font-weight: 500;
      color: var(--text-2);
      letter-spacing: 0.02em;
    }
    .empty-state p {
      font-size: 11.5px;
      max-width: 320px;
      line-height: 1.6;
    }
    .empty-state kbd {
      font-family: var(--font-ui);
      font-size: 10.5px;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      color: var(--text-2);
    }

    .editor {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 40px 80px;
      display: flex; flex-direction: column; gap: 24px;
      animation: fadeIn var(--t-med) ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .topic-input {
      width: 100%;
      background: transparent;
      border: none;
      font-family: var(--font-ui);
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      padding: 0;
      letter-spacing: -0.01em;
    }
    .topic-input:focus {
      outline: none;
    }
    .topic-input::placeholder { color: var(--text-3); }

    .topic-row {
      display: flex; align-items: center; gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .field {
      display: flex; flex-direction: column; gap: 8px;
    }
    .field-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 9.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-3);
      font-weight: 500;
    }
    .field-label .hint {
      text-transform: none;
      letter-spacing: 0;
      font-size: 10.5px;
      color: var(--text-3);
      opacity: 0.7;
    }

    /* Rich-text editor — borderless, blends into page */
    .note-editor {
      width: 100%;
      background: transparent;
      border: none;
      padding: 4px 2px;
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.75;
      color: var(--text);
      min-height: 240px;
      outline: none;
      caret-color: var(--accent);
      letter-spacing: 0.005em;
    }
    .note-editor:empty::before {
      content: attr(data-placeholder);
      color: var(--text-3);
      font-style: italic;
      pointer-events: none;
    }
    /* Live-rendered markdown elements inside the editable */
    .note-editor h1,
    .note-editor h2,
    .note-editor h3 {
      font-family: var(--font-ui);
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
      margin: 18px 0 6px;
      line-height: 1.25;
    }
    .note-editor h1 { font-size: 22px; }
    .note-editor h2 { font-size: 18px; }
    .note-editor h3 { font-size: 15.5px; color: var(--text-2); }
    .note-editor p { margin: 0 0 10px; min-height: 1.75em; }
    .note-editor ul,
    .note-editor ol { margin: 4px 0 12px; padding-left: 22px; }
    .note-editor li { margin: 2px 0; }
    .note-editor strong { color: var(--text); font-weight: 600; }
    .note-editor em { color: var(--text); font-style: italic; }
    .note-editor code {
      font-family: var(--font-ui);
      font-size: 0.88em;
      background: var(--bg-2);
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 4px;
      color: var(--accent);
    }
    .note-editor blockquote {
      margin: 8px 0 12px;
      padding: 2px 0 2px 14px;
      border-left: 2px solid var(--accent);
      color: var(--text-2);
      font-style: italic;
    }
    .note-editor a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    .note-editor hr {
      border: none;
      border-top: 1px dashed var(--border);
      margin: 18px 0;
    }
    /* Floating selection toolbar */
    .rt-toolbar {
      position: fixed;
      display: none;
      gap: 2px;
      padding: 4px;
      background: var(--bg-3);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 24px -8px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.2);
      z-index: 200;
      transform: translate(-50%, calc(-100% - 8px));
      animation: rtFade 140ms ease both;
    }
    .rt-toolbar.show { display: flex; }
    @keyframes rtFade {
      from { opacity: 0; transform: translate(-50%, calc(-100% - 4px)); }
      to   { opacity: 1; transform: translate(-50%, calc(-100% - 8px)); }
    }
    .rt-toolbar button {
      width: 26px; height: 26px;
      display: grid; place-items: center;
      border-radius: 4px;
      color: var(--text-2);
      font-family: var(--font-ui);
      font-size: 12px;
      transition: background var(--t-fast), color var(--t-fast);
    }
    .rt-toolbar button:hover { background: var(--hover); color: var(--text); }
    .rt-toolbar button.active { color: var(--accent); background: var(--accent-2); }
    .rt-toolbar .sep {
      width: 1px;
      background: var(--border);
      margin: 3px 2px;
    }

    .tags-area {
      display: flex; flex-wrap: wrap; gap: 6px;
      align-items: center;
    }
    .tag-pill .star {
      font-size: 9px;
      opacity: 0.85;
    }
    .tag-pill .up {
      opacity: 0.55; font-size: 11px; line-height: 1;
      cursor: pointer;
    }
    .tag-pill .up:hover { opacity: 1; }

    .tag-input-wrap {
      display: inline-flex; align-items: center;
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 1px 4px 1px 8px;
      transition: border-color var(--t-fast);
    }
    .tag-input-wrap:focus-within { border-color: var(--accent); border-style: solid; }
    .tag-input-wrap input {
      background: transparent;
      border: none;
      font-size: 10.5px;
      color: var(--text);
      padding: 3px 0;
      width: 80px;
    }
    .tag-input-wrap input:focus { outline: none; }
    .tag-input-wrap input::placeholder { color: var(--text-3); }
    .tag-input-wrap button {
      color: var(--text-3);
      padding: 0 4px;
      font-size: 14px;
      transition: color var(--t-fast);
    }
    .tag-input-wrap button:hover { color: var(--accent); }

    .relations-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 720px) {
      .relations-grid { grid-template-columns: 1fr; }
    }

    .relation-col {
      display: flex; flex-direction: column; gap: 10px;
    }
    .arrow-glyph {
      display: inline-block;
      font-family: var(--font-ui);
      width: 14px;
    }
    .relation-col .field-label .arrow-out { color: var(--green); }
    .relation-col .field-label .arrow-in { color: var(--blue); }

    .relation-list {
      display: flex; flex-wrap: wrap; gap: 6px;
      min-height: 28px;
    }
    .relation-tag {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      font-size: 11.5px;
      border-radius: 14px;
      border: 1px solid;
      cursor: pointer;
      transition: background var(--t-fast), transform var(--t-fast);
      background: transparent;
    }
    .relation-tag:hover { transform: translateY(-1px); }
    .relation-tag.outgoing { color: var(--green); border-color: var(--green); }
    .relation-tag.outgoing:hover { background: color-mix(in oklch, var(--green) 10%, transparent); }
    .relation-tag.incoming { color: var(--blue); border-color: var(--blue); cursor: pointer; }
    .relation-tag.incoming:hover { background: color-mix(in oklch, var(--blue) 10%, transparent); }
    .relation-tag .x {
      opacity: 0.55; cursor: pointer; font-size: 13px; line-height: 1;
    }
    .relation-tag .x:hover { opacity: 1; }
    .relation-empty {
      font-size: 11px; color: var(--text-3); font-style: italic;
      padding: 4px 0;
    }

    .link-row {
      display: flex; gap: 6px;
      margin-top: 6px;
    }
    .link-select {
      flex: 1;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 5px 8px;
      font-size: 11.5px;
      color: var(--text);
    }
    .link-select:focus { outline: none; border-color: var(--accent); }

    .delete-row {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
      display: flex; justify-content: flex-end;
    }
    .danger-btn {
      font-size: 11px;
      color: var(--text-3);
      padding: 4px 8px;
      border-radius: var(--radius);
      transition: color var(--t-fast), background var(--t-fast);
    }
    .danger-btn:hover { color: var(--red); background: color-mix(in oklch, var(--red) 10%, transparent); }

    /* ── Graph view ────────────────────────────────────────────────────── */
    #graph-view {
      position: fixed; inset: 0;
      background: var(--bg);
      display: none;
      flex-direction: column;
      z-index: 50;
      animation: graphIn 320ms cubic-bezier(.2, .8, .2, 1);
    }
    @keyframes graphIn {
      from { opacity: 0; transform: scale(0.985); }
      to { opacity: 1; transform: scale(1); }
    }

    #graph-header {
      height: var(--header-h);
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 14px;
      gap: 14px;
    }
    #graph-header .title-block {
      display: flex; align-items: baseline; gap: 12px;
      flex: 1; min-width: 0;
    }
    #graph-header .title {
      font-weight: 600; font-size: 12px;
      letter-spacing: 0.02em;
    }
    #graph-header .hint {
      font-size: 10.5px;
      color: var(--text-3);
      letter-spacing: 0.04em; text-transform: uppercase;
    }

    #graph-svg {
      flex: 1;
      width: 100%;
      background:
        radial-gradient(var(--border) 0.5px, transparent 0.5px) center / 22px 22px;
      cursor: grab;
    }
    #graph-svg:active { cursor: grabbing; }

    .graph-node circle {
      fill: var(--bg-3);
      stroke: var(--accent);
      stroke-width: 1.25px;
      cursor: pointer;
      transition: fill var(--t-fast), stroke-width var(--t-fast), r var(--t-fast);
    }
    .graph-node:hover circle { fill: var(--hover); }
    .graph-node.selected circle {
      fill: var(--accent-2);
      stroke-width: 2px;
    }
    .graph-node.focused circle {
      stroke-width: 2px;
      filter: drop-shadow(0 0 8px currentColor);
    }
    .graph-node text {
      fill: var(--text);
      font-family: var(--font-ui);
      font-size: 11px;
      pointer-events: none;
      dominant-baseline: middle;
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 3px;
      stroke-linejoin: round;
    }
    .graph-node.dimmed { opacity: 0.18; }
    .graph-link {
      stroke-opacity: 0.55;
      transition: stroke-opacity var(--t-med), opacity var(--t-med);
      fill: none;
    }
    .graph-link.dimmed { opacity: 0.08; }
    .level-line {
      stroke: var(--border);
      stroke-dasharray: 1 5;
      stroke-width: 1;
    }
    .level-label {
      font-family: var(--font-ui);
      font-size: 9.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      fill: var(--text-3);
    }

    /* ── Toast ─────────────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 16px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-3);
      border: 1px solid var(--border-strong);
      color: var(--text);
      padding: 8px 14px;
      border-radius: var(--radius-lg);
      font-size: 11.5px;
      letter-spacing: 0.02em;
      box-shadow: 0 6px 24px rgba(0,0,0,0.3);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--t-med), transform var(--t-med);
      z-index: 100;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Scrollbar in light mode adjustments */
    html[data-theme="light"] body::before {
      background-image: radial-gradient(oklch(0.85 0.008 75) 0.5px, transparent 0.5px);
    }
  </style>
</head>
<body>

<!-- Header ──────────────────────────────────────────────────────── -->
<header>
  <a class="brand" href="index.html" title="Back to home" style="text-decoration:none;color:inherit;">
    <div class="brand-mark">
      <svg viewBox="0 0 14 14">
        <line class="ln" x1="3" y1="3" x2="11" y2="7"/>
        <line class="ln" x1="3" y1="3" x2="7" y2="11"/>
        <line class="ln" x1="11" y1="7" x2="7" y2="11"/>
        <circle class="dot" cx="3" cy="3" r="2"/>
        <circle class="dot" cx="11" cy="7" r="1.5"/>
        <circle class="dot" cx="7" cy="11" r="1.5"/>
      </svg>
    </div>
    <span id="brand-name">graphnotes</span>
  </a>

  <div class="nav-btns">
    <button class="nav-btn" id="nav-back" title="Back" onclick="navBack()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12 L6 8 L10 4"/></svg>
    </button>
    <button class="nav-btn" id="nav-fwd" title="Forward" onclick="navForward()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4 L10 8 L6 12"/></svg>
    </button>
  </div>

  <div class="breadcrumb" id="breadcrumb"></div>

  <div class="save-status" id="save-status">
    <span class="dot"></span>
    <span class="txt">saved</span>
  </div>

  <div class="header-right">
    <button class="btn" onclick="showGraph()" title="Open graph view (G)">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <circle cx="3" cy="3" r="1.6"/><circle cx="11" cy="3" r="1.6"/>
        <circle cx="7" cy="11" r="1.6"/>
        <line x1="3.8" y1="3.8" x2="6.2" y2="10.2"/>
        <line x1="10.2" y1="3.8" x2="7.8" y2="10.2"/>
      </svg>
      <span>graph</span>
    </button>
    <button class="icon-btn chat-toggle" id="chat-toggle-btn" onclick="toggleChat()" title="Ask the assistant (⌘/)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.5 4 L13.5 4 A1 1 0 0 1 14.5 5 L14.5 11 A1 1 0 0 1 13.5 12 L6 12 L3.5 14 L3.5 12 A1 1 0 0 1 2.5 11 Z"/>
        <line x1="5.5" y1="7" x2="5.5" y2="7.01"/>
        <line x1="8" y1="7" x2="8" y2="7.01"/>
        <line x1="10.5" y1="7" x2="10.5" y2="7.01"/>
      </svg>
    </button>
    <button class="icon-btn" id="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
      <svg id="theme-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
    <button class="icon-btn" onclick="cmdOpen()" title="Open file">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5 L2 12 A1 1 0 0 0 3 13 L13 13 A1 1 0 0 0 14 12 L14 6 A1 1 0 0 0 13 5 L8 5 L6.5 3.5 L3 3.5 A1 1 0 0 0 2 4.5 Z"/></svg>
    </button>
    <button class="btn primary" onclick="newNote()" title="New note (N)">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="2" x2="6" y2="10"/><line x1="2" y1="6" x2="10" y2="6"/></svg>
      <span>new</span>
    </button>
  </div>
</header>

<!-- Graph view ──────────────────────────────────────────────────── -->
<div id="graph-view">
  <div id="graph-header">
    <div class="title-block">
      <span class="title">graph</span>
      <span class="hint">click to open · scroll to zoom · drag to pan</span>
    </div>
    <div class="tag-bar" id="graph-tag-filter"></div>
    <button class="icon-btn" onclick="hideGraph()" title="Close (Esc)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg>
    </button>
  </div>
  <svg id="graph-svg"></svg>
</div>

<!-- Chat panel ──────────────────────────────────────────────────── -->
<aside class="chat-panel" id="chat-panel" aria-hidden="true">
  <div class="chat-head">
    <span class="title">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="3" cy="3" r="1.5"/><circle cx="11" cy="3" r="1.5"/><circle cx="7" cy="11" r="1.5"/><line x1="3.7" y1="3.7" x2="6.3" y2="10.3"/><line x1="10.3" y1="3.7" x2="7.7" y2="10.3"/></svg>
      <span>assistant</span>
    </span>
    <span class="ctx" id="chat-ctx">grounded in <b id="chat-ctx-name">your graph</b></span>
    <button class="icon-btn" onclick="clearChat()" title="Clear conversation">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5 L13 5"/><path d="M5 5 L5 13 A1 1 0 0 0 6 14 L10 14 A1 1 0 0 0 11 13 L11 5"/><path d="M6 5 L6 3 A1 1 0 0 1 7 2 L9 2 A1 1 0 0 1 10 3 L10 5"/></svg>
    </button>
    <button class="icon-btn" onclick="toggleChat()" title="Close (⌘/)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg>
    </button>
  </div>
  <div class="chat-body" id="chat-body"></div>
  <div class="chat-input-wrap">
    <div class="chat-input-row">
      <textarea id="chat-input" placeholder="ask anything about your notes..." rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"
        oninput="autoGrowChat(this)"></textarea>
      <button class="chat-send" id="chat-send-btn" onclick="sendChat()" title="Send (Enter)">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="7" x2="12" y2="7"/><path d="M8 3 L12 7 L8 11"/></svg>
      </button>
    </div>
    <div class="chat-foot">
      <span><kbd>↵</kbd> send · <kbd>⇧↵</kbd> newline</span>
      <span id="chat-status">ready</span>
    </div>
  </div>
</aside>

<!-- Main layout ─────────────────────────────────────────────────── -->
<div class="layout">
  <aside>
    <div class="sidebar-section tight">
      <div class="search-wrap">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><line x1="10.3" y1="10.3" x2="13.5" y2="13.5"/></svg>
        <input class="search-input" id="search-input" type="text" placeholder="search..." oninput="renderSidebar()" />
      </div>
    </div>

    <div class="sidebar-section tight" id="tag-filter-section" style="display:none">
      <div class="sidebar-head">
        <span class="label">tags</span>
      </div>
      <div class="tag-bar" id="tag-filter-bar"></div>
    </div>

    <div class="sidebar-section tight" style="display:flex; align-items:center; justify-content: space-between; padding-top: 12px; padding-bottom: 6px; border-bottom: none;">
      <span class="label">notes</span>
      <span class="count-pill" id="note-count">0</span>
    </div>

    <div class="note-list" id="note-list"></div>
  </aside>

  <main id="main">
    <div class="empty-state" id="empty-state">
      <svg class="glyph" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <circle cx="36" cy="12" r="3"/>
        <circle cx="12" cy="36" r="3"/>
        <circle cx="36" cy="36" r="3"/>
        <circle cx="24" cy="24" r="3"/>
        <line x1="14.5" y1="13.5" x2="21.5" y2="22.5"/>
        <line x1="33.5" y1="13.5" x2="26.5" y2="22.5"/>
        <line x1="14.5" y1="34.5" x2="21.5" y2="25.5"/>
        <line x1="33.5" y1="34.5" x2="26.5" y2="25.5"/>
      </svg>
      <h2>no note selected</h2>
      <p>pick a note from the sidebar, press <kbd>N</kbd> for a new one, or <kbd>G</kbd> to see the graph.</p>
    </div>

    <div class="editor" id="editor" style="display:none">
      <div class="topic-row">
        <input id="input-topic" class="topic-input" type="text" placeholder="untitled topic" />
      </div>

      <div class="field">
        <div id="input-note" class="note-editor" contenteditable="true" data-placeholder="start writing... try # heading, **bold**, *italic*, - list, > quote, `code`"></div>
      </div>

      <div class="field">
        <div class="field-label">tags <span class="hint">first is primary</span></div>
        <div class="tags-area" id="tags-container"></div>
      </div>

      <div class="relations-grid">
        <div class="relation-col">
          <div class="field-label"><span class="arrow-out arrow-glyph">→</span> prerequisites</div>
          <div class="relation-list" id="outgoing-list"></div>
          <div class="link-row">
            <select class="link-select" id="link-select"><option value="">add prerequisite...</option></select>
          </div>
        </div>
        <div class="relation-col">
          <div class="field-label"><span class="arrow-in arrow-glyph">←</span> prerequisite to</div>
          <div class="relation-list" id="incoming-list"></div>
        </div>
      </div>

      <div class="delete-row">
        <button class="danger-btn" onclick="deleteNote()">delete note</button>
      </div>
    </div>
  </main>
</div>

<div id="toast"></div>

<!-- Tweaks panel mount -->
<div id="tweaks-mount"></div>

<script>
  // ── Config / Tweakables ─────────────────────────────────────────────────
  const TWEAKS = /*EDITMODE-BEGIN*/{
    "theme": "dark",
    "accentHue": 70,
    "density": "comfy",
    "showDots": true,
    "graphLevels": true,
    "graphCurved": true,
    "graphNodeSize": 18,
    "linkDistance": 200
  }/*EDITMODE-END*/;

  // ── Data ────────────────────────────────────────────────────────────────
  let notes = {};
  let selectedTopic = null;
  let tagFilter = null;
  let fileHandle = null;

  // navigation history
  let history = [];
  let historyIdx = -1;
  let suppressHistory = false;

  // autosave state
  let saveTimer = null;
  let savedTimer = null;

  // ── Theme ───────────────────────────────────────────────────────────────
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    TWEAKS.theme = t;
    const icon = document.getElementById('theme-icon');
    if (t === 'light') {
      // moon
      icon.innerHTML = '<path d="M13 9.5 A5 5 0 1 1 6.5 3 A4 4 0 0 0 13 9.5 Z"/>';
    } else {
      // sun
      icon.innerHTML = '<circle cx="8" cy="8" r="3"/><line x1="8" y1="1.5" x2="8" y2="3"/><line x1="8" y1="13" x2="8" y2="14.5"/><line x1="1.5" y1="8" x2="3" y2="8"/><line x1="13" y1="8" x2="14.5" y2="8"/><line x1="3.3" y1="3.3" x2="4.4" y2="4.4"/><line x1="11.6" y1="11.6" x2="12.7" y2="12.7"/><line x1="3.3" y1="12.7" x2="4.4" y2="11.6"/><line x1="11.6" y1="4.4" x2="12.7" y2="3.3"/>';
    }
  }
  function toggleTheme() {
    const next = TWEAKS.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    persistTweaks();
  }
  function persistTweaks() {
    window.parent && window.parent.postMessage({type: '__edit_mode_set_keys', edits: TWEAKS}, '*');
    localStorage.setItem('graph-notes-tweaks', JSON.stringify(TWEAKS));
  }
  function applyAccent(hue) {
    document.documentElement.style.setProperty('--accent', `oklch(0.78 0.14 ${hue})`);
    document.documentElement.style.setProperty('--accent-2', `oklch(0.78 0.14 ${hue} / 0.12)`);
    if (document.documentElement.getAttribute('data-theme') === 'light') {
      document.documentElement.style.setProperty('--accent', `oklch(0.55 0.16 ${hue})`);
      document.documentElement.style.setProperty('--accent-2', `oklch(0.55 0.16 ${hue} / 0.12)`);
    }
    TWEAKS.accentHue = hue;
  }
  function applyDensity(d) {
    TWEAKS.density = d;
    if (d === 'compact') {
      document.documentElement.style.setProperty('--header-h', '38px');
      document.documentElement.style.setProperty('--sidebar-w', '230px');
    } else if (d === 'spacious') {
      document.documentElement.style.setProperty('--header-h', '52px');
      document.documentElement.style.setProperty('--sidebar-w', '290px');
    } else {
      document.documentElement.style.removeProperty('--header-h');
      document.documentElement.style.removeProperty('--sidebar-w');
    }
  }
  function applyDots(on) {
    TWEAKS.showDots = on;
    document.body.style.setProperty('--dots-display', on ? 'block' : 'none');
    document.body.style.setProperty('background-image', on ? '' : 'none');
    // Toggle the ::before via class
    document.body.classList.toggle('no-dots', !on);
  }
  // CSS for no-dots
  const styleEl = document.createElement('style');
  styleEl.textContent = `body.no-dots::before { display: none !important; }`;
  document.head.appendChild(styleEl);

  // ── Tag color (deterministic from string) ───────────────────────────────
  function tagColor(tag) {
    let h = 0;
    for (let i = 0; i < tag.length; i++) h = (h * 31 + tag.charCodeAt(i)) >>> 0;
    const hue = h % 360;
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    return isLight
      ? `oklch(0.50 0.13 ${hue})`
      : `oklch(0.78 0.11 ${hue})`;
  }
  function tagBg(tag) {
    let h = 0;
    for (let i = 0; i < tag.length; i++) h = (h * 31 + tag.charCodeAt(i)) >>> 0;
    const hue = h % 360;
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    return isLight
      ? `oklch(0.50 0.13 ${hue} / 0.10)`
      : `oklch(0.78 0.11 ${hue} / 0.12)`;
  }
  function allTags() {
    const s = new Set();
    Object.values(notes).forEach(n => (n.tags || []).forEach(t => s.add(t)));
    return [...s].sort();
  }

  // ── Collection identity ─────────────────────────────────────────────────
  const params = new URLSearchParams(location.search);
  const COLLECTION_ID = params.get('id') || 'default';
  const NOTES_KEY = `graph-notes:${COLLECTION_ID}`;
  const INDEX_KEY = 'graph-notes:index';

  function readIndex() {
    try { return JSON.parse(localStorage.getItem(INDEX_KEY) || '[]'); } catch { return []; }
  }
  function writeIndex(idx) { localStorage.setItem(INDEX_KEY, JSON.stringify(idx)); }
  function touchIndex() {
    const idx = readIndex();
    let entry = idx.find(e => e.id === COLLECTION_ID);
    const meta = collectionMeta();
    if (!entry) {
      entry = { id: COLLECTION_ID, name: meta.name, created: Date.now() };
      idx.push(entry);
    }
    entry.updated = Date.now();
    entry.count = Object.keys(notes).length;
    entry.linkCount = Object.values(notes).reduce((a, n) => a + (n.subtopics || []).length, 0);
    entry.tags = [...new Set(Object.values(notes).flatMap(n => n.tags || []))].slice(0, 8);
    writeIndex(idx);
  }
  function collectionMeta() {
    const idx = readIndex();
    return idx.find(e => e.id === COLLECTION_ID) || { name: COLLECTION_ID === 'default' ? 'my notes' : COLLECTION_ID };
  }

  // ── Persistence ─────────────────────────────────────────────────────────
  function persist() {
    localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
    touchIndex();
    showSaving();
  }

  function showSaving() {
    const status = document.getElementById('save-status');
    status.classList.remove('saved');
    status.classList.add('saving');
    status.querySelector('.txt').textContent = 'saving';
    clearTimeout(savedTimer);
    savedTimer = setTimeout(() => {
      status.classList.remove('saving');
      status.classList.add('saved');
      status.querySelector('.txt').textContent = 'saved';
      setTimeout(() => {
        status.classList.remove('saved');
        status.querySelector('.txt').textContent = 'saved';
      }, 1800);
    }, 350);
  }

  function load() {
    const stored = localStorage.getItem(NOTES_KEY);
    if (stored) {
      try { notes = JSON.parse(stored); } catch (e) {}
    }
    if (!stored || Object.keys(notes).length === 0) {
      // Only seed sample notes for the default collection
      if (COLLECTION_ID === 'default') {
        notes = sampleNotes();
        localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
      } else {
        notes = {};
      }
    }
    touchIndex();

    const t = localStorage.getItem('graph-notes-tweaks');
    if (t) {
      try { Object.assign(TWEAKS, JSON.parse(t)); } catch (e) {}
    }
    applyTheme(TWEAKS.theme);
    applyAccent(TWEAKS.accentHue);
    applyDensity(TWEAKS.density);
    applyDots(TWEAKS.showDots);

    render();
  }

  // ── History (back/forward) ──────────────────────────────────────────────
  function pushHistory(topic) {
    if (suppressHistory) return;
    if (history[historyIdx] === topic) return;
    history = history.slice(0, historyIdx + 1);
    history.push(topic);
    historyIdx = history.length - 1;
    updateNavBtns();
  }
  function navBack() {
    if (historyIdx <= 0) return;
    historyIdx--;
    suppressHistory = true;
    selectNote(history[historyIdx]);
    suppressHistory = false;
    updateNavBtns();
  }
  function navForward() {
    if (historyIdx >= history.length - 1) return;
    historyIdx++;
    suppressHistory = true;
    selectNote(history[historyIdx]);
    suppressHistory = false;
    updateNavBtns();
  }
  function updateNavBtns() {
    document.getElementById('nav-back').disabled = historyIdx <= 0;
    document.getElementById('nav-fwd').disabled = historyIdx >= history.length - 1;
  }

  // ── Render ──────────────────────────────────────────────────────────────
  function render() {
    renderSidebar();
    renderBreadcrumb();
    if (selectedTopic && notes[selectedTopic]) {
      renderEditor(selectedTopic);
    } else {
      selectedTopic = null;
      document.getElementById('empty-state').style.display = '';
      document.getElementById('editor').style.display = 'none';
    }

  function renderSidebar() {
    // Tag filter
    const tags = allTags();
    const tagSection = document.getElementById('tag-filter-section');
    const filterBar = document.getElementById('tag-filter-bar');
    filterBar.innerHTML = '';
    if (tags.length > 0) {
      tagSection.style.display = '';
      const allBtn = document.createElement('span');
      allBtn.className = 'tag-pill all' + (tagFilter === null ? ' active' : '');
      allBtn.textContent = 'all';
      allBtn.onclick = () => { tagFilter = null; render(); };
      filterBar.appendChild(allBtn);
      tags.forEach(tag => {
        const pill = document.createElement('span');
        pill.className = 'tag-pill' + (tagFilter === tag ? ' active' : '');
        const c = tagColor(tag);
        pill.style.background = tagBg(tag);
        pill.style.borderColor = c;
        pill.style.color = c;
        pill.textContent = tag;
        pill.onclick = () => { tagFilter = tagFilter === tag ? null : tag; render(); };

    }

    // Note list

      .filter(topic => !tagFilter || (notes[topic].tags || []).includes(tagFilter))
      .filter(topic => !query || topic.toLowerCase().includes(query) || (notes[topic].note || '').toLowerCase().includes(query));

    document.getElementById('note-count').textContent = filtered.length;

    if (filtered.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-list';

      name.className = 'note-name';
      name.textContent = topic;
      el.appendChild(name);

      const incomingCount = Object.keys(notes).filter(t => t !== topic && (notes[t].subtopics || []).includes(topic)).length;
      const total = linkCount + incomingCount;
      if (total > 0) {
        const meta = document.createElement('span');
        meta.className = 'note-meta';
        meta.textContent = total;

  function renderEditor(topic) {
    const node = notes[topic];
    document.getElementById('empty-state').style.display = 'none';
    const editor = document.getElementById('editor');
    editor.style.display = 'flex';
    // re-trigger fade animation
    editor.style.animation = 'none';
    void editor.offsetWidth;
    editor.style.animation = '';

    document.getElementById('input-topic').value = topic;
    document.getElementById('input-note').innerHTML = mdToHtml(node.note || '');

    const outgoing = node.subtopics || [];
    const incoming = Object.keys(notes).filter(t => t !== topic && (notes[t].subtopics || []).includes(topic));

    // Outgoing
    const outgoingList = document.getElementById('outgoing-list');
    outgoingList.innerHTML = '';
    if (outgoing.length === 0) {
      outgoingList.innerHTML = '<span class="relation-empty">no prerequisites</span>';
    } else {
      outgoing.forEach(neighbor => {
        const tag = document.createElement('div');
        tag.className = 'relation-tag outgoing';
        tag.onclick = () => selectNote(neighbor);
        tag.innerHTML = `<span>${neighbor}</span>`;
        const rm = document.createElement('span');
        rm.className = 'x'; rm.textContent = '×'; rm.title = 'remove';
        rm.onclick = (e) => { e.stopPropagation(); unlinkNote(topic, neighbor); };
        tag.appendChild(rm);
        outgoingList.appendChild(tag);
      });
    }

    // Incoming
    const incomingList = document.getElementById('incoming-list');
    incomingList.innerHTML = '';
    if (incoming.length === 0) {
      incomingList.innerHTML = '<span class="relation-empty">nothing depends on this yet</span>';
    } else {
      incoming.forEach(neighbor => {
        const tag = document.createElement('div');
        tag.className = 'relation-tag incoming';
        tag.onclick = () => selectNote(neighbor);
        tag.innerHTML = `<span>${neighbor}</span>`;
        incomingList.appendChild(tag);
      });
    }

    // Tags
    if (!notes[topic].tags) notes[topic].tags = [];
    const tagsContainer = document.getElementById('tags-container');
    tagsContainer.innerHTML = '';
    notes[topic].tags.forEach((tag, i) => {
      const pill = document.createElement('span');
      pill.className = 'tag-pill';
      const c = tagColor(tag);
      pill.style.background = tagBg(tag);
      pill.style.borderColor = c;
      pill.style.color = c;
      if (i === 0) {
        const star = document.createElement('span');
        star.className = 'star'; star.textContent = '★';
        pill.appendChild(star);
      } else {
        const up = document.createElement('span');
        up.className = 'up'; up.textContent = '↑'; up.title = 'make primary';
        up.onclick = (e) => {
          e.stopPropagation();
          notes[topic].tags.splice(i, 1);
          notes[topic].tags.unshift(tag);
          persist(); renderEditor(topic); renderSidebar();
        };
        pill.appendChild(up);
      }
      pill.appendChild(document.createTextNode(tag));
      const x = document.createElement('span');
      x.className = 'x'; x.textContent = '×'; x.title = 'remove';
      x.onclick = (e) => {
        e.stopPropagation();
        notes[topic].tags = notes[topic].tags.filter(t => t !== tag);
        persist(); renderEditor(topic); renderSidebar();
      };
      pill.appendChild(x);
      tagsContainer.appendChild(pill);
    });
    // Tag input
    const inputWrap = document.createElement('span');
    inputWrap.className = 'tag-input-wrap';
    const inp = document.createElement('input');
    inp.id = 'tag-input';
    inp.type = 'text';
    inp.placeholder = '+ tag';
    inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); addTag(); } };
    inputWrap.appendChild(inp);
    tagsContainer.appendChild(inputWrap);

    // Link select
    const sel = document.getElementById('link-select');
    sel.innerHTML = '<option value="">add prerequisite...</option>';
    Object.keys(notes).sort().forEach(t => {
      if (t !== topic && !outgoing.includes(t)) {
        const opt = document.createElement('option');
        opt.value = t; opt.textContent = t;
        sel.appendChild(opt);
      }
    });
    sel.onchange = () => {
      if (sel.value) {
        notes[topic].subtopics.push(sel.value);
        persist(); renderEditor(topic);
      }
    };
  }

  // ── Auto-save wiring ────────────────────────────────────────────────────
  function scheduleAutoSave() {
    if (!selectedTopic) return;
    showSaving();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => commitEdits(), 400);
  }
  function commitEdits() {
    if (!selectedTopic || !notes[selectedTopic]) return;
    const newTopic = document.getElementById('input-topic').value.trim();
    const newNoteText = htmlToMd(document.getElementById('input-note'));
    if (!newTopic) return; // don't commit empty rename

    if (newTopic !== selectedTopic) {
      if (notes[newTopic]) {
        toast(`'${newTopic}' already exists`);
        document.getElementById('input-topic').value = selectedTopic;
        return;
      }
      notes[newTopic] = { ...notes[selectedTopic] };
      Object.keys(notes).forEach(t => {
        notes[t].subtopics = (notes[t].subtopics || []).map(n => n === selectedTopic ? newTopic : n);
      });
      // update history
      history = history.map(h => h === selectedTopic ? newTopic : h);
      delete notes[selectedTopic];
      selectedTopic = newTopic;
      persist();
      renderSidebar();
      renderBreadcrumb();
      return;
    }
    notes[selectedTopic].note = newNoteText;
    persist();
  }

  // ── Actions ─────────────────────────────────────────────────────────────
  function selectNote(topic) {
    if (!notes[topic]) return;
    // commit any pending edits before switching
    if (selectedTopic && notes[selectedTopic]) commitEdits();
    selectedTopic = topic;
    pushHistory(topic);
    render();
  }

  function newNote() {
    const base = 'untitled';
    let i = 1;
    let name = base;
    while (notes[name]) { i++; name = `${base} ${i}`; }
    notes[name] = { note: '', subtopics: [], tags: [] };
    selectedTopic = name;
    pushHistory(name);
    persist();
    render();
    setTimeout(() => {
      const t = document.getElementById('input-topic');
      t.focus(); t.select();
    }, 50);
  }

  function deleteNote() {
    if (!selectedTopic) return;
    if (!confirm(`Delete '${selectedTopic}'?`)) return;
    const topic = selectedTopic;
    delete notes[topic];
    Object.keys(notes).forEach(t => {
      notes[t].subtopics = (notes[t].subtopics || []).filter(n => n !== topic);
    });
    history = history.filter(h => h !== topic);
    historyIdx = Math.min(historyIdx, history.length - 1);
    selectedTopic = null;
    persist();
    render();
    updateNavBtns();
    toast('note deleted');
  }

  function addTag() {
    if (!selectedTopic) return;
    const input = document.getElementById('tag-input');
    const tag = input.value.trim();
    if (!tag) return;
    if (!notes[selectedTopic].tags) notes[selectedTopic].tags = [];
    if (!notes[selectedTopic].tags.includes(tag)) {
      notes[selectedTopic].tags.push(tag);
      persist(); renderEditor(selectedTopic); renderSidebar();
      setTimeout(() => document.getElementById('tag-input').focus(), 30);
    }
    input.value = '';
  }

  function unlinkNote(a, b) {
    notes[a].subtopics = (notes[a].subtopics || []).filter(n => n !== b);
    persist();
    renderEditor(a);
  }

  // ── File API ────────────────────────────────────────────────────────────
  const FILE_OPTS = {
    types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
  };
  async function cmdOpen() {
    if (!window.showOpenFilePicker) {
      toast('file system api not available in this browser');
      return;
    }
    let handle;
    try {
      [handle] = await window.showOpenFilePicker(FILE_OPTS);
    } catch (e) { if (e.name !== 'AbortError') console.error(e); return; }
    try {
      const text = await (await handle.getFile()).text();
      notes = JSON.parse(text);
    } catch (e) { toast('invalid json file'); return; }
    fileHandle = handle;
