  function computeLevels(notes) {
    const ids = Object.keys(notes);
    const level = {};
    ids.forEach(id => level[id] = 0);
    for (let iter = 0; iter < ids.length; iter++) {
      let changed = false;
      ids.forEach(id => {
        const prereqs = (notes[id].subtopics || []).filter(p => level[p] !== undefined);
        if (prereqs.length > 0) {
          const next = Math.max(...prereqs.map(p => level[p])) + 1;
          if (next > level[id]) { level[id] = next; changed = true; }
        }
      });
      if (!changed) break;
    }
    return level;
  }

  function renderGraph() {
    const svg = d3.select('#graph-svg');
    svg.selectAll('*').remove();

    const width = svg.node().clientWidth;
    const height = svg.node().clientHeight;

    const visibleIds = new Set(
      Object.keys(notes).filter(id => !tagFilter || (notes[id].tags || []).includes(tagFilter))
    );
    const nodeData = [...visibleIds].map(id => ({ id }));
    const linkData = [];
    Object.keys(notes).forEach(source => {
      if (!visibleIds.has(source)) return;
      (notes[source].subtopics || []).forEach(target => {
        if (visibleIds.has(target)) linkData.push({ source, target });
      });
    });

    const levels = computeLevels(notes);
    const maxLevel = Math.max(...Object.values(levels), 0);
    const padding = 90;
    const levelSpacing = maxLevel > 0 ? (height - padding * 2) / maxLevel : 0;

    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    const text2 = getComputedStyle(document.documentElement).getPropertyValue('--text-2').trim();

    // arrow marker
    const defs = svg.append('defs');
    defs.append('marker')
      .attr('id', 'arrow')
      .attr('viewBox', '0 -4 8 8')
      .attr('refX', TWEAKS.graphNodeSize + 6)
      .attr('refY', 0)
      .attr('markerWidth', 6)
      .attr('markerHeight', 6)
      .attr('orient', 'auto')
      .append('path')
      .attr('d', 'M0,-3L7,0L0,3')
      .attr('fill', text2);

    // Zoom container
    const g = svg.append('g');
    const zoom = d3.zoom().scaleExtent([0.2, 3]).on('zoom', e => g.attr('transform', e.transform));
    svg.call(zoom);

    // Level guides
    const guideG = svg.append('g').attr('class', 'level-guides').lower();
    if (TWEAKS.graphLevels && maxLevel > 0) {
      // We draw guides in screen space (not zoom container) so labels stay readable
    }

    const simulation = d3.forceSimulation(nodeData)
      .force('link', d3.forceLink(linkData).id(d => d.id).distance(TWEAKS.linkDistance).strength(0.3))
      .force('charge', d3.forceManyBody().strength(-700))
      .force('x', d3.forceX(width / 2).strength(0.05))
      .force('y', d3.forceY(d => padding + levels[d.id] * levelSpacing).strength(TWEAKS.graphLevels ? 0.6 : 0.05))
      .force('collision', d3.forceCollide(TWEAKS.graphNodeSize + 30));

    // links — paths so we can curve
    const link = g.append('g')
      .selectAll('path')
      .data(linkData)
      .join('path')
      .attr('class', 'graph-link')
      .attr('stroke', text2)
      .attr('stroke-width', 1)
      .attr('marker-end', 'url(#arrow)');

    const node = g.append('g')
      .selectAll('g')
      .data(nodeData)
      .join('g')
      .attr('class', d => 'graph-node' + (d.id === selectedTopic ? ' selected' : ''))
      .call(d3.drag()
        .on('start', (event, d) => {
          if (!event.active) simulation.alphaTarget(0.3).restart();
          d.fx = d.x; d.fy = d.y;
        })
        .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
        .on('end', (event, d) => {
          if (!event.active) simulation.alphaTarget(0);
          d.fx = null; d.fy = null;
        })
      )
      .on('click', (event, d) => {
        if (event.defaultPrevented) return;
        hideGraph();
        selectNote(d.id);
      })
      .on('mouseover', (event, d) => {
        const connected = new Set([d.id]);
        linkData.forEach(l => {
          const src = typeof l.source === 'object' ? l.source.id : l.source;
          const tgt = typeof l.target === 'object' ? l.target.id : l.target;
          if (src === d.id || tgt === d.id) { connected.add(src); connected.add(tgt); }
        });
        node.classed('dimmed', n => !connected.has(n.id))
            .classed('focused', n => n.id === d.id);
        link.classed('dimmed', l => {
          const src = typeof l.source === 'object' ? l.source.id : l.source;
          const tgt = typeof l.target === 'object' ? l.target.id : l.target;
          return !connected.has(src) || !connected.has(tgt);
        });
      })
      .on('mouseout', () => {
        node.classed('dimmed', false).classed('focused', false);
        link.classed('dimmed', false);
      });

    node.append('circle')
      .attr('r', TWEAKS.graphNodeSize)
      .style('stroke', d => {
        const primary = (notes[d.id]?.tags || [])[0];
        return primary ? tagColor(primary) : accent;
      })
      .style('color', d => {
        const primary = (notes[d.id]?.tags || [])[0];
        return primary ? tagColor(primary) : accent;
      });

    node.append('text')
      .text(d => d.id.length > 18 ? d.id.slice(0, 17) + '…' : d.id)
      .attr('x', TWEAKS.graphNodeSize + 6)
      .attr('y', 0);

    // Level labels (in screen space)
    if (TWEAKS.graphLevels && maxLevel > 0) {
      const labelG = svg.append('g').attr('class', 'level-labels');
      for (let l = 0; l <= maxLevel; l++) {
        const y = padding + l * levelSpacing;
        labelG.append('line')
          .attr('class', 'level-line')
          .attr('x1', 24).attr('x2', width - 110)
          .attr('y1', y).attr('y2', y);
        labelG.append('text')
          .attr('class', 'level-label')
          .attr('x', width - 18)
          .attr('y', y)
          .attr('text-anchor', 'end')
          .attr('dominant-baseline', 'middle')
          .text(l === 0 ? 'foundational' : `depth ${String(l).padStart(2, '0')}`);
      }
    }

    simulation.on('tick', () => {
      link.attr('d', d => {
        const sx = d.source.x, sy = d.source.y, tx = d.target.x, ty = d.target.y;
        if (!TWEAKS.graphCurved) return `M${sx},${sy} L${tx},${ty}`;
        const dx = tx - sx, dy = ty - sy;
        const dr = Math.sqrt(dx*dx + dy*dy) * 1.6;
        return `M${sx},${sy} A${dr},${dr} 0 0,1 ${tx},${ty}`;
      });
      node.attr('transform', d => `translate(${d.x},${d.y})`);
    });
  }

  // ── Keyboard shortcuts ──────────────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    const inField = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
    if (e.key === 'Escape') {
      if (document.getElementById('graph-view').style.display === 'flex') hideGraph();
      return;
    }
    if (inField) return;
    if (e.key === 'g' || e.key === 'G') { showGraph(); }
    if (e.key === 'n' || e.key === 'N') { newNote(); }
    if ((e.metaKey || e.ctrlKey) && e.key === '[') { e.preventDefault(); navBack(); }
    if ((e.metaKey || e.ctrlKey) && e.key === ']') { e.preventDefault(); navForward(); }
    if (e.key === '/') { e.preventDefault(); document.getElementById('search-input').focus(); }
  });

  // ── Rich-text: markdown ⇄ html ─────────────────────────────────────────
  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function inlineMd(s) {
    s = escapeHtml(s);
    s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^\*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^\*])\*([^\*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  function mdToHtml(md) {
    if (!md) return '';
    const lines = md.split('\n');
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const ln = lines[i];
      let m;
      if ((m = ln.match(/^(#{1,3})\s+(.*)$/))) {
        out.push(`<h${m[1].length}>${inlineMd(m[2])}</h${m[1].length}>`);
        i++; continue;
      }
      if (/^\s*---\s*$/.test(ln)) { out.push('<hr>'); i++; continue; }
      if (/^>\s?/.test(ln)) {
        const block = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          block.push(inlineMd(lines[i].replace(/^>\s?/, ''))); i++;
        }
        out.push('<blockquote>' + block.join('<br>') + '</blockquote>'); continue;
      }
      if (/^\s*[-*]\s+/.test(ln)) {
        out.push('<ul>');
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          out.push('<li>' + inlineMd(lines[i].replace(/^\s*[-*]\s+/, '')) + '</li>'); i++;
        }
        out.push('</ul>'); continue;
      }
      if (/^\s*\d+\.\s+/.test(ln)) {
        out.push('<ol>');
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          out.push('<li>' + inlineMd(lines[i].replace(/^\s*\d+\.\s+/, '')) + '</li>'); i++;
        }
        out.push('</ol>'); continue;
      }
      if (ln.trim() === '') { out.push('<p><br></p>'); i++; continue; }
      // paragraph (consume contiguous non-block lines)
      const para = [];
      while (i < lines.length && lines[i].trim() !== ''
             && !/^(#{1,3}\s|>|\s*[-*]\s|\s*\d+\.\s|---\s*$)/.test(lines[i])) {
        para.push(inlineMd(lines[i])); i++;
      }
      out.push('<p>' + para.join('<br>') + '</p>');
    }
    return out.join('');
  }
  function htmlToMd(root) {
    const lines = [];
    function walk(node, prefix='') {
      node.childNodes.forEach(child => {
        if (child.nodeType === 3) {
          if (lines.length === 0) lines.push('');
          lines[lines.length-1] += child.textContent;
          return;
        }
        if (child.nodeType !== 1) return;
        const tag = child.tagName.toLowerCase();
        if (tag === 'h1') { lines.push('# ' + child.textContent); lines.push(''); return; }
        if (tag === 'h2') { lines.push('## ' + child.textContent); lines.push(''); return; }
        if (tag === 'h3') { lines.push('### ' + child.textContent); lines.push(''); return; }
        if (tag === 'hr') { lines.push('---'); lines.push(''); return; }
        if (tag === 'blockquote') {
          child.textContent.split('\n').forEach(l => lines.push('> ' + l));
          lines.push(''); return;
        }
        if (tag === 'ul' || tag === 'ol') {
          let n = 1;
          child.querySelectorAll(':scope > li').forEach(li => {
            const bullet = tag === 'ul' ? '- ' : (n++ + '. ');
            lines.push(bullet + inlineHtmlToMd(li));
          });
          lines.push(''); return;
        }
        if (tag === 'p' || tag === 'div') {
          lines.push(inlineHtmlToMd(child)); return;
        }
        if (tag === 'br') { lines.push(''); return; }
        // fallback inline
        if (lines.length === 0) lines.push('');
        lines[lines.length-1] += inlineHtmlToMd(child);
      });
    }
    function inlineHtmlToMd(el) {
      let s = '';
      el.childNodes.forEach(c => {
        if (c.nodeType === 3) { s += c.textContent; return; }
        if (c.nodeType !== 1) return;
        const t = c.tagName.toLowerCase();
        if (t === 'br') { s += '\n'; return; }
        if (t === 'strong' || t === 'b') { s += '**' + inlineHtmlToMd(c) + '**'; return; }
        if (t === 'em' || t === 'i') { s += '*' + inlineHtmlToMd(c) + '*'; return; }
        if (t === 'code') { s += '`' + c.textContent + '`'; return; }
        if (t === 'a') { s += '[' + inlineHtmlToMd(c) + '](' + (c.getAttribute('href')||'') + ')'; return; }
        s += inlineHtmlToMd(c);
      });
      return s;
    }
    walk(root);
    // collapse 3+ blank lines to 2
    return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }
  window.mdToHtml = mdToHtml;
  window.htmlToMd = htmlToMd;

  // ── Floating selection toolbar ──────────────────────────────────────────
  (function setupRichToolbar() {
    const editor = document.getElementById('input-note');
    if (!editor) return;
    const tb = document.createElement('div');
    tb.className = 'rt-toolbar';
    tb.innerHTML = `
      <button data-cmd="bold" title="bold (⌘B)" style="font-weight:700">B</button>
      <button data-cmd="italic" title="italic (⌘I)" style="font-style:italic">I</button>
      <button data-cmd="code" title="inline code">&lt;/&gt;</button>
      <span class="sep"></span>
      <button data-block="h1" title="heading 1">H1</button>
      <button data-block="h2" title="heading 2">H2</button>
      <button data-block="blockquote" title="quote">&ldquo;</button>
      <button data-list="ul" title="bullet list">•</button>
      <button data-list="ol" title="numbered">1.</button>
    `;
    document.body.appendChild(tb);

    function hide() { tb.classList.remove('show'); }
    function place() {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return hide();
      const r = sel.getRangeAt(0);
      if (!editor.contains(r.commonAncestorContainer)) return hide();
      const rect = r.getBoundingClientRect();
      if (!rect || (rect.width === 0 && rect.height === 0)) return hide();
      tb.style.left = (rect.left + rect.width / 2) + 'px';
      tb.style.top = rect.top + 'px';
      tb.classList.add('show');
    }
    document.addEventListener('selectionchange', place);
    editor.addEventListener('blur', () => setTimeout(() => {
      if (!tb.matches(':hover')) hide();
    }, 120));

    tb.addEventListener('mousedown', (e) => e.preventDefault());
    tb.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      editor.focus();
      if (b.dataset.cmd === 'bold') document.execCommand('bold');
      else if (b.dataset.cmd === 'italic') document.execCommand('italic');
      else if (b.dataset.cmd === 'code') {
        const sel = window.getSelection();
        if (!sel.rangeCount) return;
        const r = sel.getRangeAt(0);
        const c = document.createElement('code');
        c.textContent = r.toString();
        r.deleteContents(); r.insertNode(c);
      }
      else if (b.dataset.block) document.execCommand('formatBlock', false, b.dataset.block);
      else if (b.dataset.list === 'ul') document.execCommand('insertUnorderedList');
      else if (b.dataset.list === 'ol') document.execCommand('insertOrderedList');
      place();
      if (window.scheduleAutoSave) window.scheduleAutoSave();
    });
  })();

  // Wire auto-save to inputs on any keystroke after init
  document.addEventListener('input', (e) => {
    if (e.target.id === 'input-topic' || e.target.id === 'input-note') {
      scheduleAutoSave();
    }
  });
  // Commit on blur
  document.addEventListener('focusout', (e) => {
    if (e.target.id === 'input-topic' || e.target.id === 'input-note') {
      commitEdits();
    }
  });

  // Resize → re-render graph if open
  window.addEventListener('resize', () => {
    if (document.getElementById('graph-view').style.display === 'flex') renderGraph();
  });

  // ── Chat panel ──────────────────────────────────────────────────────────
  let chatHistory = [];
  let chatOpen = false;

  function toggleChat() {
    chatOpen = !chatOpen;
    document.getElementById('chat-panel').classList.toggle('open', chatOpen);
    document.getElementById('chat-toggle-btn').classList.toggle('active', chatOpen);
    document.body.classList.toggle('chat-open', chatOpen);
    if (chatOpen) {
      renderChatCtx();
      if (chatHistory.length === 0) renderChatWelcome();
      setTimeout(() => document.getElementById('chat-input').focus(), 250);
    }
  }
  function renderChatCtx() {
    const name = (typeof selectedTopic !== 'undefined' && selectedTopic)
      ? selectedTopic
      : (typeof collectionMeta === 'function' ? (collectionMeta().name || 'your graph') : 'your graph');
    document.getElementById('chat-ctx-name').textContent = name;
  }
  function autoGrowChat(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(120, el.scrollHeight) + 'px';
  }
  function escHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function linkifyRefs(text) {
    // replace [[note name]] and #note-name patterns with chip links
    let out = escHtml(text);
    out = out.replace(/\[\[([^\]]+)\]\]/g, (_, n) => {
      const safe = n.trim();
      const exists = notes && notes[safe];
      return `<a class="chat-ref" onclick="selectNoteFromChat('${safe.replace(/'/g,"\\'")}')">${escHtml(safe)}${exists?'':' <span style=\"opacity:.5\">·new</span>'}</a>`;
    });
    out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return out;
  }
  function selectNoteFromChat(name) {
    if (notes && notes[name]) selectNote(name);
    else toast(`'${name}' not in graph`);
  }
  function addChatMsg(role, html) {
    const body = document.getElementById('chat-body');
    const m = document.createElement('div');
    m.className = 'chat-msg ' + role;
    const avatarHtml = role === 'ai'
      ? '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="3" cy="3" r="1.5"/><circle cx="11" cy="3" r="1.5"/><circle cx="7" cy="11" r="1.5"/><line x1="3.7" y1="3.7" x2="6.3" y2="10.3"/><line x1="10.3" y1="3.7" x2="7.7" y2="10.3"/></svg>'
      : 'u';
    m.innerHTML = `<div class="chat-avatar">${avatarHtml}</div><div class="chat-bubble">${html}</div>`;
    body.appendChild(m);
    body.scrollTop = body.scrollHeight;
    return m;
  }
  function clearChat() {
    chatHistory = [];
    document.getElementById('chat-body').innerHTML = '';
    renderChatWelcome();
  }
  function renderChatWelcome() {
    const body = document.getElementById('chat-body');
    body.innerHTML = '';
    const name = (typeof selectedTopic !== 'undefined' && selectedTopic) ? selectedTopic : null;
    const intro = name
      ? `i've read all your notes. ask me anything about <a class="chat-ref" onclick="selectNoteFromChat('${name.replace(/'/g,"\\'")}')">${escHtml(name)}</a> or the wider graph.`
      : `i've read all your notes. pick a note in the sidebar, or just ask anything about your graph.`;
    addChatMsg('ai', intro);
    const sugs = name
      ? [`explain ${name} in plain language`, `what should i learn before ${name}?`, `quiz me on ${name}`, `suggest related notes to add`]
      : [`summarize my graph`, `what are the foundational notes?`, `find gaps in my knowledge`, `suggest connections i missed`];
    const sugWrap = document.createElement('div');
    sugWrap.className = 'chat-suggestions';
    sugWrap.innerHTML = `<div class="label">try asking</div>` +
      sugs.map(s => `<button class="chat-sug" onclick="useSuggestion(this)">${escHtml(s)}</button>`).join('');
    body.appendChild(sugWrap);
  }
  function useSuggestion(b) {
    const i = document.getElementById('chat-input');
    i.value = b.textContent;
    autoGrowChat(i);
    sendChat();
  }
  function buildContext() {
    const lines = [];
    const ids = Object.keys(notes || {});
    lines.push(`The user's knowledge graph has ${ids.length} notes.`);
    ids.slice(0, 60).forEach(id => {
      const n = notes[id];
      const prereqs = (n.subtopics || []).join(', ') || 'none';
      const tags = (n.tags || []).join(', ') || 'none';
      const body = (n.note || '').replace(/\s+/g, ' ').slice(0, 240);
      lines.push(`- ${id} [tags: ${tags}] [prereqs: ${prereqs}]${body ? ' :: ' + body : ''}`);
    });
    if (selectedTopic) lines.push(`\nThe user is currently viewing the note: "${selectedTopic}".`);
    lines.push(`\nWhen referencing notes in your reply, wrap each name in [[double brackets]] so it becomes a clickable chip. Keep replies concise and helpful.`);
    return lines.join('\n');
  }
  async function sendChat() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    autoGrowChat(input);
    const sendBtn = document.getElementById('chat-send-btn');
    sendBtn.disabled = true;
    document.getElementById('chat-status').textContent = 'thinking…';

    // remove suggestions if present
    const sug = document.querySelector('.chat-suggestions');
    if (sug) sug.remove();

    addChatMsg('user', escHtml(text));
    chatHistory.push({ role: 'user', content: text });

    const aiMsg = addChatMsg('ai', '<span class="chat-typing"><span></span><span></span><span></span></span>');

    try {
      const system = buildContext();
      const messages = chatHistory.map(m => ({ role: m.role, content: m.content }));
      const reply = await window.claude.complete({
        system,
        messages,
      });
      aiMsg.querySelector('.chat-bubble').innerHTML = linkifyRefs(reply);
      chatHistory.push({ role: 'assistant', content: reply });
      document.getElementById('chat-status').textContent = 'ready';
    } catch (e) {
      aiMsg.querySelector('.chat-bubble').innerHTML = '<em style="color:var(--red)">couldn\'t reach the assistant. try again in a moment.</em>';
      document.getElementById('chat-status').textContent = 'error';
    } finally {
      sendBtn.disabled = false;
      document.getElementById('chat-body').scrollTop = document.getElementById('chat-body').scrollHeight;
    }
  }
  // refresh ctx when active note changes
  const _origSelect = window.selectNote;
  if (typeof _origSelect === 'function') {
    window.selectNote = function(n) { _origSelect(n); if (chatOpen) renderChatCtx(); };
  }
  // Keyboard shortcut: Cmd/Ctrl + /
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === '/') {
      e.preventDefault();
      toggleChat();
    }
  });

  // ── Init ────────────────────────────────────────────────────────────────
  load();
  updateNavBtns();
</script>

<!-- Tweaks panel (React) -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
  const { useState, useEffect } = React;
  const { TweaksPanel, useTweaks, TweakSection, TweakRadio, TweakSlider, TweakToggle, TweakColor, TweakSelect } = window;

  function TweaksApp() {
    const [open, setOpen] = useState(false);

    useEffect(() => {
      const handler = (event) => {
        const data = event.data || {};
        if (data.type === '__activate_edit_mode') setOpen(true);
        if (data.type === '__deactivate_edit_mode') setOpen(false);
      };
      window.addEventListener('message', handler);
      window.parent.postMessage({type: '__edit_mode_available'}, '*');
      return () => window.removeEventListener('message', handler);
    }, []);

    if (!open) return null;

    const t = window.TWEAKS;

    const update = (key, value) => {
      window.TWEAKS[key] = value;
      // apply
      if (key === 'theme') window.applyTheme(value);
      if (key === 'accentHue') window.applyAccent(value);
      if (key === 'density') window.applyDensity(value);
      if (key === 'showDots') window.applyDots(value);
      if (['graphLevels','graphCurved','graphNodeSize','linkDistance'].includes(key)) {
        if (document.getElementById('graph-view').style.display === 'flex') {
          window.renderGraph();
        }
      }
      window.persistTweaks();
      // force re-render
      setTick(x => x + 1);
    };
    const [, setTick] = useState(0);

    return (
      <TweaksPanel onClose={() => {
        setOpen(false);
        window.parent.postMessage({type: '__edit_mode_dismissed'}, '*');
      }}>
        <TweakSection title="appearance">
          <TweakRadio
            label="theme"
            value={t.theme}
            options={[{value:'dark', label:'dark'}, {value:'light', label:'light'}]}
            onChange={v => update('theme', v)}
          />
          <TweakColor
            label="accent"
            value={`oklch(0.78 0.14 ${t.accentHue})`}
            options={[
              'oklch(0.78 0.14 70)',  // amber
              'oklch(0.78 0.14 145)', // green
              'oklch(0.78 0.14 240)', // blue
              'oklch(0.78 0.14 305)', // purple
              'oklch(0.78 0.14 25)',  // red
            ]}
            onChange={v => {
              const m = v.match(/(\d+\.?\d*)\)/);
              if (m) update('accentHue', parseFloat(m[1]));
            }}
          />
          <TweakRadio
            label="density"
            value={t.density}
            options={[
              {value:'compact', label:'compact'},
              {value:'comfy', label:'comfy'},
              {value:'spacious', label:'spacious'},
            ]}
            onChange={v => update('density', v)}
          />
          <TweakToggle
            label="dotted background"
            value={t.showDots}
            onChange={v => update('showDots', v)}
          />
        </TweakSection>

        <TweakSection title="graph">
          <TweakToggle
            label="depth levels"
            value={t.graphLevels}
            onChange={v => update('graphLevels', v)}
          />
          <TweakToggle
            label="curved edges"
            value={t.graphCurved}
            onChange={v => update('graphCurved', v)}
          />
          <TweakSlider
            label="node size"
            value={t.graphNodeSize}
            min={10} max={32} step={1}
            onChange={v => update('graphNodeSize', v)}
          />
          <TweakSlider
            label="link distance"
            value={t.linkDistance}
            min={80} max={400} step={10}
            onChange={v => update('linkDistance', v)}
          />
        </TweakSection>
      </TweaksPanel>
    );
  }

  ReactDOM.createRoot(document.getElementById('tweaks-mount')).render(<TweaksApp />);
</script>

</body>
</html>
